name: Release

# Pushing a tag like v0.2.0 builds installers for macOS, Windows and Linux, then a
# separate job attaches them (plus SHA256SUMS.txt) to a DRAFT GitHub release, which a
# maintainer reviews and publishes by hand. "Run workflow" (manual) builds the same
# installers and keeps them as workflow artifacts, without creating a release.
#
# The build jobs are read-only and always keep their installers as artifacts, so a
# failed publication never loses a build and can be re-run on its own.

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, to check the tag against the release branch
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Versions are consistent (and match the tag)
        run: node scripts/check-version.mjs "${{ github.ref_type == 'tag' && github.ref_name || '' }}"
      - name: Tag points to a commit on the release branch
        if: github.ref_type == 'tag'
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/release \
            || { echo "::error::Tag $GITHUB_REF_NAME is not on the release branch"; exit 1; }
      # OS-independent checks run once here, not in each of the three builds.
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint:fsd

  build:
    name: build (${{ matrix.name }})
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (universal)
            os: macos-latest
            artifact: macos-universal
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux
            os: ubuntu-22.04
            artifact: linux
            args: ""
            rust-targets: ""
          - name: Windows
            os: windows-latest
            artifact: windows
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev build-essential

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: Swatinem/rust-cache@v2

      - run: pnpm install --frozen-lockfile

      # Rust tests stay per OS: file handling differs between platforms.
      - run: cargo test -p vault-core --locked

      - name: Build installers
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          # Code signing is not configured yet: the installers are UNSIGNED.
          # macOS: set APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
          #        APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID (see the Tauri signing docs).
          # Windows: configure a certificate / signCommand in tauri.conf.json.
        with:
          args: ${{ matrix.args }}

      # Keep the installers as workflow artifacts (also used by the publish job).
      - name: Collect installers
        shell: bash
        env:
          ARTIFACT_PATHS: ${{ steps.tauri.outputs.artifactPaths }}
        run: |
          node -e "
            const fs = require('fs'), path = require('path');
            fs.mkdirSync('installers', { recursive: true });
            for (const p of JSON.parse(process.env.ARTIFACT_PATHS)) {
              // macOS lists Burrow.app, a directory (already inside the .dmg): skip it.
              if (fs.statSync(p).isDirectory()) { console.log('skipping directory', p); continue; }
              fs.copyFileSync(p, path.join('installers', path.basename(p)));
            }
          "
          ls -la installers
      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: burrow-${{ matrix.artifact }}
          path: installers/*
          if-no-files-found: error
          retention-days: 7

  # Tag runs only: attach the installers to a draft release. Re-runnable on its own.
  publish:
    name: publish (draft release)
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    # The only job that can write to the repository.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: burrow-*
          merge-multiple: true
          path: dist

      - name: Create (or update) the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          ls -la
          sha256sum -- * > SHA256SUMS.txt
          cat SHA256SUMS.txt

          cat > ../notes.md <<'EOF'
          **Unsigned, unaudited build.** Verify what you download (`SHA256SUMS.txt` is attached),
          keep a backup of your vault file, and read the threat model and known limitations in the
          README before trusting it with passwords you cannot afford to lose.

          macOS: the app is not notarized, so macOS blocks it the first time. On macOS 15 or later,
          open it once, then allow it in System Settings, Privacy and Security ("Open Anyway");
          on macOS 14 or earlier, right-click the app, then Open.
          Windows: SmartScreen may warn about an unknown publisher.
          EOF

          prerelease=""
          case "$TAG" in *-*) prerelease="--prerelease" ;; esac

          existing="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[] | select(.tagName == env.TAG) | .tagName')"
          if [ -n "$existing" ]; then
            echo "A release for $TAG already exists: updating its files."
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --draft $prerelease --verify-tag \
              --title "Burrow $TAG" --notes-file ../notes.md --repo "$GITHUB_REPOSITORY"
          fi
